<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Ján Regeš, https://www.siteone.io/">
    <title>SiteOne Crawler Report - {$initialHost} | {$executedAt}</title>

    <style>
        :root {
            /* colors */
            --color-white: #fff;
            --color-black: #000000;
            --color-gray-50: #f9fafb;
            --color-gray-100: #eeecec;
            --color-gray-200: #E5E7EB;
            --color-gray-300: #D1D5DB;
            --color-gray-400: #9CA3AF;
            --color-gray-500: #6B7280;
            --color-gray-600: #4B5563;
            --color-gray-700: #374151;
            --color-gray-800: #1F2937;
            --color-gray-900: #111827;
            --color-gray-950: rgb(9, 15, 32);
            --color-blue-100: #DBEAFE;
            --color-blue-500: #3B82F6;
            --color-blue-600: #2563EB;
            --color-blue-950: rgb(23, 37, 84);
            /* text-colors */
            --text-color-default: var(--color-gray-900);
            --text-color-neutral: var(--color-gray-300);
            --text-color-blue: var(--color-blue-500);
            --text-color-blue-dark: var(--color-blue-600);
            /* background-colors */
            --background-color-default: var(--color-white);
            --background-color-neutral: var(--color-gray-100);

            --border-radius: 1.5rem;
            --padding-inline: 2rem;
        }

        html * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            width: 100%;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--background-color-neutral);
            color: var(--text-color-default);
            transition: background-color 0.2s ease-out, color 0.2s ease-out;
        }

        main {
            display: flex;
            flex-direction: column;
            gap: 2rem;
        }

        section {
            background-color: var(--background-color-default);
            padding: 2rem var(--padding-inline);
            border-radius: var(--border-radius);
            transition: background-color 0.2s ease-out;
        }

        body h2 {
            margin-top: 0;
        }

        body a {
            color: var(--text-color-default);
            transition: color 0.2s ease-out;
        }

        table {
            border-collapse: collapse;
            min-width: 300px;
        }

        table.table-compact {
            font-size: 0.7em;
        }

        table,
        table th,
        table td {
            border: 1px solid var(--color-gray-100);
            padding: 2px 4px !important;
            vertical-align: top;
            text-align: left;
            transition: border-color 0.2s ease-out, background-color 0.2s ease-out;
        }

        table td.warning {
            text-align: center;
            color: var(--text-color-neutral);
        }

        table td svg {
            max-width: 100px;
            max-height: 18px;
        }

        .table-sortable th {
            cursor: pointer;
        }

        html:has(.theme-switch__input:checked) table,
        html:has(.theme-switch__input:checked) table td,
        html:has(.theme-switch__input:checked) table th {
            border-color: var(--background-color-neutral);
        }

        table th {
            background-color: var(--background-color-neutral);
        }

        html:has(.theme-switch__input:checked) table th {
            background-color: var(--background-color-neutral);
        }

        table th table.table-two-col th {
            width: 20%;
        }

        .container {
            display: flex;
            flex-direction: column;
            gap: 2rem;
            max-width: 187.5rem;
            margin: 0 auto;
            padding: 1.5rem 4rem;
        }

        header.header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background-color: var(--background-color-default);
            padding-inline: var(--padding-inline);
            padding-block: 2rem;
            border-radius: 1000px;
            border: 1px solid var(--color-gray-100);
            transition: background-color 0.2s ease-out, border-color 0.2s ease-out;
        }

        header.header a.logo {
            display: flex;
        }

        header.header h1 {
            margin: 0;
        }

        html:has(.theme-switch__input:checked) .body {
            --text-color-default: var(--color-gray-200);
            --text-color-neutral: var(--color-gray-600);
            --background-color-default: var(--color-gray-900);
            --background-color-neutral: var(--color-gray-800);
        }

        html:has(.theme-switch__input:checked) header.header {
            border-color: transparent;
        }

        .theme-switch__dot--light {
            transform: translateX(0rem);
        }

        html:has(.theme-switch__input:checked) .theme-switch__dot{
            transform: translateX(2rem);
            background-color: var(--color-gray-300);
        }

        .theme-switch label {
            display: flex;
            align-items: center;
            gap: .375rem;
            cursor: pointer;
        }

        .theme-switch__wrapper {
            display: flex;
            align-items: center;
            position: relative;
            border-radius: var(--border-radius);
            background-color: var(--color-gray-300);
            width: 4rem;
            height: 2rem;
            transition: all 0.2s ease-out;
        }

        html:has(.theme-switch__input:checked) .theme-switch__wrapper {
            background-color: var(--color-gray-600);
        }

        .theme-switch__input {
            display: none;
        }

        .theme-switch__dot {
            position: absolute;
            height: 1.5rem;
            width: 1.5rem;
            left: .25rem;
            background-color: var(--color-gray-600);
            border-radius: 50%;
            transition: all .2s ease-out;
        }

        .theme-switch__dot--light {
            transform: translateX(0rem);
        }

        .theme-switch__dot--dark {
            transform: translateX(2rem);
            background-color: var(--color-gray-300);
        }

        .info__wrapper {
            overflow-x: auto;
        }

        .summary ul {
            padding-left: 20px;
        }

        .tabs {
            display: grid;
            grid-template-columns: minmax(0, 18.225rem) 1fr;
            gap: 2rem;
        }

        .tabs__navigation {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            border-right: 1px solid var(--color-gray-700);
            padding-right: 2rem;
        }

        .tabs__radio {
            display: none;
        }

        .tabs__tab {
            display: none;
        }

        .tabs__content {
            overflow: auto;
            font-size: 0.8em;
        }

        .tabs__content ul {
            padding-left: 0px;
        }
        .tabs__content ul li {
            list-style: none;
        }

        .tabs__title {
            margin: 0;
            font-size: 1rem;
            padding: .5rem .75rem;
            background-color: var(--background-color-neutral);
            border-radius: var(--border-radius);
            transition: background-color .2s ease-out;
            cursor: pointer;
        }


        .tabs__title:hover {
            background-color: var(--color-blue-500);
            color: var(--color-white);
        }

        html:has(.theme-switch__input:checked) .tabs__title {
            background-color: var(--background-color-neutral);
        }

        html:has(.theme-switch__input:checked) .tabs__title:hover {
            background-color: var(--color-blue-600);
            color: var(--color-white);
        }

        .tabs__table {
            border-radius: var(--border-radius);
            font-size: 0.875rem;
        }

        .badge {
            display: inline-block;
            padding: 2px 4px;
            color: var(--color-white);
            border-radius: 8px;
            font-size: 0.75rem;
            line-height: 1;
            min-width: 18px;
            text-align: center;
        }
        html:has(.theme-switch__input:checked) .badge {
            color: var(--color-white);
        }
        .badge.red {
            background-color: #e3342f;
        }
        .badge.green {
            background-color: #38c172;
        }
        .badge.blue {
            background-color: #3490dc;
        }
        .badge.orange {
            background-color: #ff9234;
        }
        .badge.yellow {
            background-color: #ffed4a;
            color: var(--color-gray-800) !important;
        }
        .badge.neutral {
            background-color: #9ba7b4;
        }

        html:has(.theme-switch__input:checked) .badge.neutral {
            background-color: #718096;
        }

        .badge.in-table {
            background-color: var(--background-color-neutral);
        }

        .fulltext-container {
            display: none;
            margin-bottom: 8px;
        }

        .fulltext-container .found-rows {
            margin-bottom: 8px;
        }

        .js-enabled .fulltext-container {
            display: block;
        }

        input.fulltext {
            width: 100%;
            padding: 0.4rem;
            border-radius: 2px;
            border: 1px solid var(--background-color-neutral);
            background-color: var(--background-color-default);
            color: var(--text-color-blue);
            transition: border-color 0.2s ease-out;
            margin-right: 8px;
        }

        input.fulltext:focus, input.fulltext:focus-visible {
            outline: none;
            box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.1);
            border-color: var(--background-color-neutral) !important;
        }

        table tr.empty-fulltext {
            display: none;
        }

        ::placeholder {
            color: var(--text-color-neutral);
            opacity: 1;
        }

        ::-ms-input-placeholder {
            color: var(--text-color-neutral);
        }

        @media screen and (max-width: 64rem) {
            main {
                gap: 2.5rem;
            }

            h1 {
                font-size: 1.25rem;
            }

            .container {
                padding: 2.5rem;
            }

            .tabs {
                grid-template-columns: 1fr;
            }

            .tabs__navigation {
                justify-content: center;
                flex-direction: row;
                flex-wrap: wrap;
                padding: 0;
                border: none;
                text-align: center;
            }

            .tabs__tab {
                justify-content: center;
            }
        }

        @media screen and (max-width: 40rem) {
            :root {
                --padding-inline: 1rem;
            }

            main {
                gap: 2rem;
            }

            h1 {
                font-size: 1.25rem;
                text-align: center;
            }

            h2 {
                font-size: 1.125rem;
            }

            .container {
                padding: 1.25rem;
                gap: 2rem;
            }

            header.header {
                display: grid;
                grid-template-columns: 1fr 1fr;
                grid-template-rows: auto auto;
                gap: 1rem;
                padding-block: 1.5rem;
                border-radius: var(--border-radius);
            }

            header.header .theme-switch {
                justify-self: end;
            }

            header.header h1 {
                grid-row: 2;
                grid-column: 1 / 3;
            }

            .tabs__title {
                font-size: .875rem;
                padding: .25rem .5rem;
            }
        }

        table.seo-headings td ul {
            margin: 0;
        }

        table.seo-headings td ul ul {
            padding-left: 20px;
        }
        table.seo-headings td ul li {
            list-style: none;
        }
        table.seo-headings td.headings .badge {
            text-align: left;
            background-color: transparent;
            color: #ff9234 !important;
        }

        .table-container.show-more {
            display: block;
            max-height: 658px !important; /* based on typical sidebar height */
            overflow: hidden;
            transition: max-height 0.5s cubic-bezier(0, 1, 0, 1);
        }

        .show-more-label {
            display: block;
            cursor: pointer;
            text-align: left;
            padding: 10px 50px 10px 0;
            color: var(--color-blue-600);
        }

        .show-more-checkbox {
            display: none;
        }

        .show-more-checkbox:checked ~ .table-container.show-more {
            transition: max-height 1s ease;
            max-height: none !important;
            /* overflow: auto; */
        }

        .show-more-checkbox:checked ~ .show-more-label {
            display: none;
        }

        table tr td.url, table tr td.targetUrl, table tr td.sourceUqId, table tr td.urlPathAndQuery {
            white-space: normal;
            word-break: break-word;
            overflow-wrap: anywhere;
        }

        table tr td.urlPathAndQuery {
            max-width: 300px;
        }

        /*
        table tr td.url {
            max-width: 800px;
        }
         */

        table.large-inline-svgs tr td.detail, table.duplicate-inline-svgs tr td.detail, table.invalid-inline-svgs tr td.detail  {
            min-width: 150px;
            /*
            display: flex;
            justify-content: space-between;
            align-items: center;
             */
        }

        table.large-inline-svgs tr td.detail svg, table.duplicate-inline-svgs tr td.detail svg, table.invalid-inline-svgs tr td.detail svg {
            float: right;
            /* margin-left: auto; */
        }

        table tr td.header {
            min-width: 120px;
            white-space: nowrap;
        }

        td.status, td.type, td.time, td.size {
            white-space: nowrap;
        }

        .text-muted {
            color: var(--color-gray-600);
        }

        .help {
            cursor: help;
        }

        .form-group {
            flex-grow: 0;
            flex-basis: auto;
        }

        .btn-group {
            display: flex;
            flex-wrap: wrap;
            justify-content: flex-start;
            gap: 1px;
            border: 0;
        }

        .btn-group label {
            padding: 3px 6px;
            cursor: pointer;
            background-color: var(--background-color-neutral);
            color: var(--text-color-default);
            transition: background-color 0.3s, color 0.3s;
            white-space: nowrap;
            z-index: 1000;
        }

        .btn-group label:hover,
        .btn-group input[type="radio"]:checked + label {
            background-color: var(--color-blue-600);
            color: var(--color-white);
        }

        .btn-group input[type="radio"] {
            display: none;
        }

        .btn-group label:first-of-type {
            border-radius: 4px 0 0 4px;
        }

        .btn-group label:last-of-type {
            border-radius: 0 4px 4px 0;
        }

        .btn {
            padding: 0.5rem 1rem;
            border-radius: 1rem;
            border: 0;
            background-color: var(--color-blue-600);
            color: var(--color-white);
            cursor: pointer;
            margin-bottom: 1rem;

        }

        .image-gallery {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        .image-gallery img {
            object-fit: contain;
            transition: transform 0.3s ease;
            cursor: help;
        }

        .small .image-gallery img {
            max-width: 140px;
            max-height: 140px;
        }

        .medium .image-gallery img {
            max-width: 200px;
            max-height: 200px;
        }

        .large .image-gallery img {
            max-width: 360px;
            max-height: 360px;
        }

        .cover .image-gallery img {
            object-fit: cover;
        }

        .contain .image-gallery img {
            object-fit: contain;
        }

        .scaleDown .image-gallery img {
            object-fit: scale-down;
        }

        .image-gallery img:hover {
            transform: scale(1.3);
            z-index: -1000;
        }

        .image-gallery .highlighted {
            border: 2px solid red;
            padding: 4px;
            box-sizing: border-box;
        }

        .video-container {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .video-card {
            display: flex;
            flex-direction: column;
            border: 1px solid var(--background-color-default);
            padding: 10px;
            background-color: var(--background-color-neutral);
            box-sizing: border-box;
            min-width: 400px;
            flex: 1 1 400px;
        }

        .video-card video {
            min-width: 100%;
            min-height: 300px;
        }

        .video-caption {
            margin-top: 10px;
            text-align: center;
            font-size: 14px;
            color: var(--text-color-default);
            flex-grow: 1;
        }

        .video-container {
            align-items: stretch;
        }

        .iconset-preview {
            display: flex;
            flex-wrap: wrap;
            width: 100%;
            justify-content: flex-start;
            align-items: center;
            gap: 6px;
        }

        .iconset-icon {
            max-width: 20px;
            max-height: 20px;
            height: auto;
        }

        .paged-controls {
            display: none;
            flex-wrap: wrap;
            align-items: center;
            gap: 8px;
            margin: 8px 0;
        }

        .js-enabled .paged-controls {
            display: flex;
        }

        .js-enabled .paged-nojs {
            display: none;
        }

        .paged-controls .btn {
            margin-bottom: 0;
            padding: 0.25rem 0.75rem;
        }

        .paged-controls .btn:disabled {
            opacity: 0.4;
            cursor: default;
        }

        .paged-th {
            cursor: pointer;
        }

        {$tabsCss}

    </style>
</head>

    <script>
        function sortTable(tableId, columnKey) {

            const table = document.querySelector('#' + tableId);
            const tbody = table.querySelector('tbody');
            const rows = Array.from(tbody.querySelectorAll('tr'));
            const headerCells = Array.from(table.querySelectorAll('thead th'));
            const columnIndex = Array.from(table.querySelectorAll('thead th')).findIndex(th => th.getAttribute('data-key') === columnKey);
            const direction = headerCells[columnIndex].getAttribute('data-direction');
            const dataType = headerCells[columnIndex].getAttribute('data-type');

            rows.sort((a, b) => {
                if (a.children.length !== b.children.length) {
                    return 0;
                }
                let aValue = a.children[columnIndex].getAttribute('data-value');
                let bValue = b.children[columnIndex].getAttribute('data-value');

                if (dataType === 'number') {
                    aValue = parseFloat(aValue);
                    bValue = parseFloat(bValue);
                }

                if (direction === 'ASC') {
                    return aValue > bValue ? 1 : aValue < bValue ? -1 : 0;
                } else {
                    return aValue < bValue ? 1 : aValue > bValue ? -1 : 0;
                }
            });

            rows.forEach(row => tbody.appendChild(row));

            headerCells.forEach(th => {
                let label = th.getAttribute('data-label');
                if (th.getAttribute('data-key') === columnKey) {
                    th.innerHTML = label + (direction === 'ASC' ? '&nbsp;🔼' : '&nbsp;🔽');
                    th.setAttribute('data-direction', direction === 'ASC' ? 'DESC' : 'ASC');
                } else {
                    th.textContent = label;
                }
            });
        }

        function debounce(callback, timeout) {
            let timerId;
            return function (...args) {
                clearTimeout(timerId);
                timerId = setTimeout(() => {
                    callback.apply(this, args);
                }, timeout);
            };
        }

        function tableFulltext(tableId, searchTerm) {
            var table = document.getElementById(tableId);
            if (!table) {
                console.warn('Table with id "' + tableId + '" was not found.');
                return;
            }
            searchTerm = searchTerm.trim().toLowerCase();

            /* index table rows for effective fulltext search */
            if (table.getAttribute('data-fulltext-ready') !== '1') {
                var rows = table.getElementsByTagName('tr');
                for (var i = 0; i < rows.length; i++) {
                    var cells = rows[i].getElementsByTagName('td');
                    var fulltextValue = '';
                    for (var j = 0; j < cells.length; j++) {
                        fulltextValue += cells[j].textContent + ' ';
                    }
                    fulltextValue = fulltextValue.trim();
                    rows[i].setAttribute('data-fulltext', fulltextValue.toLowerCase());
                }
                table.setAttribute('data-fulltext-ready', '1');
            }

            var terms = searchTerm.split(' ');

            var tbody = table.getElementsByTagName('tbody')[0];
            var rows = tbody.getElementsByTagName('tr');
            var foundRows = 0;
            for (var i = 0; i < rows.length; i++) {
                var rowFulltext = rows[i].getAttribute('data-fulltext') || '';
                var display = terms.every(function(term) {
                    return rowFulltext.includes(term);
                }) ? '' : 'none';

                if (display === '') {
                    foundRows++;
                }

                rows[i].style.display = display;
            }

            var emptyFulltextRow = table.getElementsByClassName('empty-fulltext')[0];
            emptyFulltextRow.style.display = foundRows > 0 ? 'none' : 'table-row';

            document.getElementById('foundRows_' + tableId).textContent = 'Found ' + foundRows + ' row(s).';
        }

        var tableFulltextDebouncers = {};

        function debouncedTableFulltext(tableId, searchTerm) {
            if (!tableFulltextDebouncers[tableId]) {
                tableFulltextDebouncers[tableId] = debounce(tableFulltext, 250);
            }
            tableFulltextDebouncers[tableId](tableId, searchTerm);
        }

        /* Paged sections (#99): Visited URLs and Image Gallery with more than 1000 items keep their rows
           in a JSON array and only the current page in the DOM. The markup templates below mirror
           src/export/html_report/paged.rs (VisitedUrlRow::to_html, GalleryImage::to_html, badge_html). */
        var PAGED_TONES = {g: 'green', y: 'yellow', o: 'orange', r: 'red'};
        var PAGED_SIZE_FILTERS = ['any', '> 5 MB', '> 1MB', '> 500kB', '> 100kB', '> 10kB', '< 10kB'];
        var pagedStates = {};

        function pagedEsc(value) {
            return String(value).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#039;');
        }

        function pagedBadge(text, tone) {
            var cls = PAGED_TONES[tone];
            return cls ? '<span class="badge ' + cls + '">' + pagedEsc(text) + '</span>' : pagedEsc(text);
        }

        function pagedVisitedUrlRow(r) {
            return '<tr><td class="url"><a href="' + pagedEsc(r[0]) + '" target="_blank">' + pagedEsc(r[1]) + '</a></td>' +
                '<td class="status">' + pagedBadge(r[3], r[4]) + '</td>' +
                '<td class="type">' + pagedEsc(r[5]) + '</td>' +
                '<td class="time">' + pagedBadge(r[7], r[8]) + '</td>' +
                '<td class="size">' + pagedBadge(r[10], r[11]) + '</td>' +
                '<td class="cacheLifetime">' + pagedBadge(r[13], r[14]) + '</td></tr>';
        }

        function pagedGalleryItem(r, px) {
            return '<a href="' + pagedEsc(r[0]) + '" target="_blank"><img loading="lazy" width="' + px + '" height="' + px +
                '" src="' + pagedEsc(r[0]) + '" alt="' + pagedEsc(r[4]) + '" title="' + pagedEsc(r[4]) + '"></a>';
        }

        function pagedState(id) {
            var st = pagedStates[id];
            if (st.data === null) {
                st.data = JSON.parse(document.getElementById(id + '_data').textContent);
                st.view = st.data;
            }
            return st;
        }

        function pagedThumbnailSize() {
            var container = document.getElementById('igc');
            var mode = container ? container.className : 'small';
            return mode === 'medium' ? 200 : (mode === 'large' ? 360 : 140);
        }

        function pagedSizeMatches(size, category) {
            var kb = size / 1024;
            switch (category) {
                case '> 5 MB': return kb > 5120;
                case '> 1MB': return kb > 1024;
                case '> 500kB': return kb > 500;
                case '> 100kB': return kb > 100;
                case '> 10kB': return kb > 10;
                case '< 10kB': return kb < 10;
                default: return true;
            }
        }

        function pagedRender(id) {
            var st = pagedState(id);
            var pages = Math.max(1, Math.ceil(st.view.length / st.size));
            st.page = Math.min(Math.max(st.page, 0), pages - 1);
            var items = st.view.slice(st.page * st.size, (st.page + 1) * st.size);
            var html = [];
            var i;
            if (st.kind === 'visited-urls') {
                for (i = 0; i < items.length; i++) {
                    html.push(pagedVisitedUrlRow(items[i]));
                }
                if (items.length === 0) {
                    html.push('<tr><td colspan="6" class="warning">No rows found, please edit your search term.</td></tr>');
                }
            } else {
                var px = pagedThumbnailSize();
                for (i = 0; i < items.length; i++) {
                    html.push(pagedGalleryItem(items[i], px));
                }
            }
            document.getElementById(id + '_items').innerHTML = html.join('');
            var info = 'Page ' + (st.page + 1) + ' of ' + pages + ' (' + st.view.length + ' items)';
            document.querySelectorAll('.paged-info[data-paged-id="' + id + '"]').forEach(function (el) {
                el.textContent = info;
            });
            document.querySelectorAll('.paged-prev[data-paged-id="' + id + '"]').forEach(function (el) {
                el.disabled = st.page === 0;
            });
            document.querySelectorAll('.paged-next[data-paged-id="' + id + '"]').forEach(function (el) {
                el.disabled = st.page >= pages - 1;
            });
            var found = document.getElementById('foundRows_' + id);
            if (found) {
                found.textContent = 'Found ' + st.view.length + ' row(s).';
            }
        }

        function pagedUpdateView(id) {
            var st = pagedState(id);
            var list = st.data;
            if (st.kind === 'visited-urls' && st.terms.length > 0) {
                if (st.search === null) {
                    st.search = st.data.map(function (r) {
                        return (r[0] + ' ' + r[3] + ' ' + r[5] + ' ' + r[7] + ' ' + r[10] + ' ' + r[13]).toLowerCase();
                    });
                }
                list = st.data.filter(function (r, index) {
                    return st.terms.every(function (term) {
                        return st.search[index].indexOf(term) !== -1;
                    });
                });
            }
            if (st.kind === 'image-gallery') {
                list = st.data.filter(function (r) {
                    return (st.filters.type === 'any' || r[2] === st.filters.type) &&
                        (st.filters.source === 'any' || r[3] === st.filters.source) &&
                        pagedSizeMatches(r[1], st.filters.size);
                });
            }
            if (st.sortIndex >= 0) {
                var index = st.sortIndex;
                var numeric = st.sortType === 'number';
                var direction = st.sortDir === 'ASC' ? 1 : -1;
                list = list.slice().sort(function (a, b) {
                    var x = numeric ? a[index] : String(a[index]);
                    var y = numeric ? b[index] : String(b[index]);
                    return (x > y ? 1 : (x < y ? -1 : 0)) * direction;
                });
            }
            st.view = list;
            st.page = 0;
        }

        function pagedSort(id, th) {
            var st = pagedState(id);
            var index = parseInt(th.getAttribute('data-sort'), 10);
            st.sortDir = (st.sortIndex === index && st.sortDir === 'ASC') ? 'DESC' : 'ASC';
            st.sortIndex = index;
            st.sortType = th.getAttribute('data-type');
            document.querySelectorAll('.paged-th[data-paged-id="' + id + '"]').forEach(function (header) {
                var label = header.getAttribute('data-label');
                if (header === th) {
                    header.innerHTML = pagedEsc(label) + (st.sortDir === 'ASC' ? '&nbsp;🔼' : '&nbsp;🔽');
                } else {
                    header.textContent = label;
                }
            });
            pagedUpdateView(id);
            pagedRender(id);
        }

        function pagedFilter(id, key, value) {
            pagedState(id).filters[key] = value;
            pagedUpdateView(id);
            pagedRender(id);
        }

        function pagedAddRadio(groupId, index, label, checked, onChange) {
            var group = document.getElementById(groupId);
            if (!group) {
                return;
            }
            var input = document.createElement('input');
            input.type = 'radio';
            input.id = groupId + '-' + index;
            input.name = groupId;
            input.checked = checked;
            input.addEventListener('change', onChange);
            var labelEl = document.createElement('label');
            labelEl.setAttribute('for', input.id);
            labelEl.textContent = label;
            group.appendChild(input);
            group.appendChild(labelEl);
        }

        function pagedInitGallery(id) {
            var st = pagedState(id);
            var counts = {type: {}, source: {}};
            st.data.forEach(function (r) {
                counts.type[r[2]] = (counts.type[r[2]] || 0) + 1;
                counts.source[r[3]] = (counts.source[r[3]] || 0) + 1;
            });
            [['typeFilters', 'type'], ['sourceFilters', 'source']].forEach(function (group) {
                var groupCounts = counts[group[1]];
                pagedAddRadio(group[0], 0, 'any (' + st.data.length + ')', true, function () {
                    pagedFilter(id, group[1], 'any');
                });
                Object.keys(groupCounts).sort(function (a, b) {
                    return groupCounts[b] - groupCounts[a];
                }).forEach(function (value, index) {
                    pagedAddRadio(group[0], index + 1, value + ' (' + groupCounts[value] + ')', false, function () {
                        pagedFilter(id, group[1], value);
                    });
                });
            });
            PAGED_SIZE_FILTERS.forEach(function (category, index) {
                var count = st.data.filter(function (r) {
                    return pagedSizeMatches(r[1], category);
                }).length;
                if (count > 0) {
                    pagedAddRadio('sizeFilters', index, category + ' (' + count + ')', index === 0, function () {
                        pagedFilter(id, 'size', category);
                    });
                }
            });
        }

        function initPagedSections() {
            document.querySelectorAll('.paged[data-paged-id]').forEach(function (section) {
                var id = section.getAttribute('data-paged-id');
                pagedStates[id] = {
                    kind: section.getAttribute('data-paged-kind'),
                    data: null,
                    view: null,
                    search: null,
                    page: 0,
                    size: 100,
                    sortIndex: -1,
                    sortDir: 'ASC',
                    sortType: 'string',
                    terms: [],
                    filters: {type: 'any', source: 'any', size: 'any'}
                };
                if (pagedStates[id].kind === 'image-gallery') {
                    pagedInitGallery(id);
                }
            });
            document.querySelectorAll('input.paged-fulltext[data-paged-id]').forEach(function (input) {
                var id = input.getAttribute('data-paged-id');
                var search = debounce(function (value) {
                    pagedState(id).terms = value.trim().toLowerCase().split(/\s+/).filter(function (term) {
                        return term !== '';
                    });
                    pagedUpdateView(id);
                    pagedRender(id);
                }, 250);
                input.addEventListener('keyup', function () {
                    search(input.value);
                });
            });
            document.querySelectorAll('select.paged-size[data-paged-id]').forEach(function (select) {
                select.addEventListener('change', function () {
                    var id = select.getAttribute('data-paged-id');
                    var st = pagedState(id);
                    st.size = parseInt(select.value, 10);
                    st.page = 0;
                    pagedRender(id);
                });
            });
            document.addEventListener('click', function (event) {
                var target = event.target.closest('.paged-prev, .paged-next, .paged-th');
                if (!target) {
                    return;
                }
                var id = target.getAttribute('data-paged-id');
                if (target.classList.contains('paged-th')) {
                    pagedSort(id, target);
                    return;
                }
                pagedState(id).page += target.classList.contains('paged-next') ? 1 : -1;
                pagedRender(id);
            });
        }

        document.addEventListener('DOMContentLoaded', function () {
            /* add event listeners to fulltext inputs above super tables */
            function onFulltextKeyup(event) {
                const dataUqId = event.target.getAttribute('data-uq-id');
                const inputValue = event.target.value;
                debouncedTableFulltext(dataUqId, inputValue);
            }

            const inputs = document.querySelectorAll('input.fulltext[data-uq-id]');
            inputs.forEach(input => {
                input.addEventListener('keyup', onFulltextKeyup);
            });

            /* add event listeners to sortable table headers */
            function onTableHeaderClick(event) {
                const dataUqId = event.target.getAttribute('data-uq-id');
                const dataKey = event.target.getAttribute('data-key');
                sortTable(dataUqId, dataKey);
            }

            const tableHeaders = document.querySelectorAll('th.sortable-th[data-uq-id]');
            tableHeaders.forEach(th => {
                th.addEventListener('click', onTableHeaderClick);
            });

            /* add event listeners to image gallery filters */
            function onImageFilterClick(event) {
                const dataKey = event.target.getAttribute('data-key');
                updateClassName(dataKey, event.target.value);
            }

            const imgFilters = document.querySelectorAll('input.idf[data-key]');
            imgFilters.forEach(f => {
                f.addEventListener('change', onImageFilterClick);
            });

            /* paged Visited URLs / Image Gallery sections (#99) */
            initPagedSections();
        });

    </script>
</div>
